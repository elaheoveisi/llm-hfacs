name: Plan Approval & Branch Creation

on:
  issue_comment:
    types: [created]

jobs:
  approve_and_branch:
    # Trigger only when the PI/collaborator comments "/approve"
    if: {% raw %}contains(github.event.comment.body, '/approve'){% endraw %}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Task Branch
        id: create_branch
        uses: peter-evans/create-issue-branch@v5
        with:
          token: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
          # Creates clean, readable names like: feature/issue-14-lstm-pipeline
          branchName: 'feature/issue-${{ github.event.issue.number }}-${{ github.event.issue.title }}'

      - name: Assign Issue and Notify Student
        uses: actions/github-script@v6
        with:
          script: |
            const assignee = {% raw %}context.payload.issue.user.login;{% endraw %}
            const issueNumber = context.issue.number;

            // Fetch the exact branch name generated by the create-issue-branch step
            const branchName = '{% raw %}${{ steps.create_branch.outputs.branch-name }}{% endraw %}';

            // 1. Assign the issue to the student who proposed the plan
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: [assignee]
            });

            // 2. Post the approval notification with native checkout commands
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `@${assignee} **Your task design and justification are approved!**`,
                `This issue has been assigned to you, and your tracking branch has been generated.`,
                ``,
                `### Next Steps:`,
                `\`\`\`bash`,
                `git fetch origin`,
                `git checkout ${branchName}`,
                `\`\`\``
              ].join('\n')
            });