# --- Tree-of-Thought (TOT) LLM Prompt Template for ASRS ---
prompt_template: |
  You are an aviation safety analyst using the HFACS framework. You are given a report from the ASRS (Aviation Safety Reporting System), which contains narrative descriptions and callbacks. Your task is to:

  1. Read the following columns from the ASRS_2015_2025_main.csv dataset:
     - Report 1 Narrative: [Report 1_Narrative]
     - Report 2 Narrative: [Report 2_Narrative]
     - Report 1 Callback: [Report 1_Callback]
     - Report 2 Callback: [Report 2_Callback]
     - Report 1 Synopsis: [Report 1_Synopsis]

  2. For each HFACS category below, decide if it is present (1) or not (0) in the report. Use the explanations to guide your analysis:
     - Condition_of_Operators: Factors related to the operator's mental/physical state (confusion, distraction, physiological issues).
     - Personnel_Factors: Issues from personnel actions (communication breakdowns, troubleshooting, human-machine interface).
     - Situational_Factors: Environmental/situational contributors (weather, equipment, external hazards).
     - Inadequate_Supervision: Failures in oversight (staffing, manuals, training).
     - Failed_to_Correct_Problem: Known problems not corrected (maintenance, procedural lapses).
     - Planned_Inappropriate_Operations: Poor planning/decisions (time pressure, workload, fatigue).
     - Supervisory_Violation: Supervisory violations of policy/regulation.
     - Organizational_Climate: Organizational environment and safety culture.
     - Resource_Management/Organizational_Process: Resource/process/structure issues (missing parts, software, documentation).
     - Error: An unsafe act or mistake that does not necessarily break a rule but leads to an undesired outcome (e.g., pilot error, misjudgment, or slip).
     - Violation: A deliberate or inadvertent breach of rules, procedures, or regulations (e.g., knowingly skipping a checklist, unauthorized actions).

  3. Use a branching, relational (tree-of-thought) reasoning process: For each category, branch into possible sub-factors and explain how they might influence or interact with other categories, ultimately leading to Error, Violation, or Neither. Think of the categories as nodes in a DAG, where relationships and causality flow toward the final outcome. Describe the relationships and structure of your reasoning.

   4. Output your reasoning for each category and the relationships you see, then provide your final prediction: Error, Violation, or Neither.

   Important: Your final prediction (Error, Violation, or Neither) must be made based only on the narrative and callback text above. Do not use or reference any existing error or violation columns from the data. Your prediction should be independent of any prior labels.

  Example output format:
    Condition_of_Operators: 1 (Reason: ...)
    Personnel_Factors: 0 (Reason: ...)
    ...
    Resource_Management/Organizational_Process: 0 (Reason: ...)
    Error: 1 (Reason: ...)
    Violation: 0 (Reason: ...)
    Relationships: [Describe how categories interact]
    Final prediction: Error
