temperature: 0

system_prompt: |
  You are an expert HFACS aviation safety analyst.
  Classify strictly using evidence explicitly stated in the text provided.
  Do not infer, assume, or guess beyond what is written.
  Return only valid JSON. No commentary outside the JSON.

step1_prompt: |
  Read the accident narrative below. For each of the seven HFACS subcategories
  under Preconditions for Unsafe Acts, determine whether it is present.
  Mark Present = "Yes" only when the narrative explicitly states evidence.
  Provide a brief quote or paraphrase as Evidence; leave Evidence empty if No.
  Also rewrite the accident narrative in your own language, preserving only the
  facts explicitly stated in the original narrative. Do not add new causes,
  motives, unsafe acts, or assumptions.
  Finally, extract the narrative facts that are directly relevant to unsafe-act
  classification:
  - Unsafe_Act_Relevant_Facts: short factual phrases from the narrative that
    may help distinguish AE100, AE200, Both, or Neither.
  - Explicit_Decision_Evidence: evidence of a clearly stated unsafe choice,
    plan, judgment, continuation, or risk acceptance; leave empty if absent.
  - Explicit_Execution_Evidence: evidence of a clearly stated execution,
    handling, checklist, control, slip, lapse, or skill-based failure; leave
    empty if absent.

  ── SITUATIONAL FACTORS ──────────────────────────────────────

  PE100 — Physical Environment
     The external physical conditions in which the operation took place.
     Includes: adverse weather (IMC, turbulence, icing, gusts, low visibility,
     wind shear), terrain, lighting, runway/surface conditions, wildlife, FOD.
     Is there evidence of a physical environmental condition in this narrative?

  PE200 — Tools / Technology
     Equipment, automation, or interface conditions that affected performance.
     Includes: automation mode confusion, misleading or failed instruments,
     inadequate cockpit design, insufficient warnings, HMI deficiencies,
     equipment malfunction.
     Is there evidence of a tools or technology condition in this narrative?

  ── PERSONNEL FACTORS ────────────────────────────────────────

  PP100 — Communication, Coordination & Planning
     Failures in crew communication, coordination, or pre-flight planning.
     Includes: CRM breakdown, ATC/crew miscommunication, inadequate briefing,
     poor task allocation, coordination failure, pre-flight planning errors.
     Is there evidence of a communication, coordination, or planning condition?

  PP200 — Fitness for Duty
     The operator's failure to be in a safe condition before beginning duty.
     Includes: violated crew rest requirements, self-medication, alcohol or
     substance use, known illness not reported, failure to prepare adequately
     before the flight.
     Is there evidence of a fitness-for-duty condition in this narrative?

  ── CONDITION OF OPERATORS ───────────────────────────────────

  PC100 — Mental States
     Adverse psychological or cognitive states during the operation.
     Includes: loss of situational awareness, channelized attention, distraction,
     complacency, get-there-itis, overconfidence, task saturation, stress, anxiety.
     Is there evidence of an adverse mental state in this narrative?

  PC200 — Physiological States
     Adverse physical or physiological conditions affecting the operator during flight.
     Includes: fatigue, hypoxia, spatial disorientation, visual illusions,
     nausea, medication side effects, illness onset during flight.
     Is there evidence of an adverse physiological state in this narrative?

  PC300 — Physical / Mental Limitations
     Inherent operator limitations that exceeded the demands of the task.
     Includes: visual limitations, reaction time limitations, insufficient training
     for the task, cognitive capacity limits, strength or coordination limitations.
     Is there evidence of a physical or mental limitation in this narrative?

  ── BOUNDARY EXAMPLES: PE200 · PC100 · PC300 ─────────────────
  Use these to resolve ambiguous cases before marking Present/No.

  EXAMPLE A — PE200 Yes · PC100 No · PC300 No
  Narrative: "During cruise the airspeed indicator began displaying erratic readings.
  The pilot cross-checked with GPS groundspeed but the instrument continued to
  fluctuate, making accurate airspeed management impossible."
  PE200 = Yes  ("airspeed indicator began displaying erratic readings" — equipment malfunction)
  PC100 = No   (pilot responded methodically; no fixation, distraction, or SA loss stated)
  PC300 = No   (task was within pilot capability; the instrument itself was the source of error)

  EXAMPLE B — PC100 Yes · PE200 No · PC300 No
  Narrative: "The instructor became fixated on completing the training maneuver despite
  worsening turbulence. When the co-pilot pointed out the deteriorating conditions,
  the instructor dismissed the concern and pressed on."
  PC100 = Yes  ("became fixated" — channelized attention; "dismissed the concern" — get-there-itis)
  PE200 = No   (no equipment or automation issue; the aircraft systems were functioning normally)
  PC300 = No   (experienced instructor; the limitation was attentional, not a capability gap)

  EXAMPLE C — PC300 Yes · PC100 No · PE200 No
  Narrative: "The student pilot, with 18 total flight hours, attempted a short-field
  landing in a 15-knot crosswind. The pilot had not yet received formal crosswind
  training and lost directional control on rollout."
  PC300 = Yes  ("had not yet received formal crosswind training" — task exceeded training level)
  PC100 = No   (no fixation, overconfidence, or complacency stated; pilot attempted in good faith)
  PE200 = No   (no equipment malfunction; the aircraft was serviceable)

  EXAMPLE D — PE200 Yes · PC100 Yes · PC300 No
  Narrative: "The GPWS issued a terrain warning but the crew silenced it, assuming
  it was a nuisance alert as on a prior leg. Fixated on completing the approach,
  the crew did not cross-check terrain on the navigation display."
  PE200 = Yes  ("assuming it was a nuisance alert" — HMI distrust / automation confusion)
  PC100 = Yes  ("Fixated on completing the approach" — channelized attention; suppressed valid warning)
  PC300 = No   (experienced crew; task was within their normal capability)

  EXAMPLE E — PC300 Yes · PC100 Yes · PE200 No
  Narrative: "The private pilot, certificated six months earlier with minimum hours,
  attempted IFR flight into actual IMC without having logged any actual instrument
  time since certification. Confident the conditions were manageable, the pilot
  continued deeper into cloud."
  PC300 = Yes  ("without having logged any actual instrument time since certification")
  PC100 = Yes  ("Confident the conditions were manageable" — overconfidence)
  PE200 = No   (instruments functioned normally; no equipment issue stated)

  BOUNDARY RULES (apply after reading examples above):
  • If the equipment itself failed or misled → PE200.  If the pilot misread working equipment → PC100 or PC300.
  • If the pilot's adverse state arose during the flight → PC100 or PC200.  If they lacked the underlying skill/capacity before the flight → PC300.
  • PC100 and PC300 can both be Yes: a pilot with insufficient training (PC300) who also became overconfident (PC100).
  • PC200 (Physiological States) requires an explicit physical symptom during flight (fatigue, hypoxia, spatial disorientation, visual illusion). Do NOT infer fatigue from a long duty day alone.
  • PP200 (Fitness for Duty) requires a pre-flight fitness failure (substance use, violated rest, known illness). Fatigue discovered in-flight is PC200, not PP200.

  Return only valid JSON in this exact format:
  {
    "Rewritten_Narrative": "",
    "Unsafe_Act_Relevant_Facts": [],
    "Explicit_Decision_Evidence": "",
    "Explicit_Execution_Evidence": "",
    "PE100_Physical_Environment":                {"Present": "Yes/No", "Evidence": ""},
    "PE200_Tools_Technology":                    {"Present": "Yes/No", "Evidence": ""},
    "PP100_Communication_Coordination_Planning": {"Present": "Yes/No", "Evidence": ""},
    "PP200_Fitness_for_Duty":                    {"Present": "Yes/No", "Evidence": ""},
    "PC100_Mental_States":                       {"Present": "Yes/No", "Evidence": ""},
    "PC200_Physiological_States":                {"Present": "Yes/No", "Evidence": ""},
    "PC300_Physical_Mental_Limitations":         {"Present": "Yes/No", "Evidence": ""}
  }

  Narrative:
  {narrative}

step2_prompt: |
  You are an HFACS expert. You are given a rewritten accident narrative and
  preconditions for unsafe acts extracted from the same aviation accident
  narrative. Based ONLY on the rewritten narrative, the extracted preconditions,
  the Evidence fields, and your HFACS knowledge, predict the unsafe acts
  classification.

  Input JSON from step 1:
  {preconditions}

  Class definitions:
  - AE100 = Performance / Skill-Based Error. Use AE100 when the person intended
    the correct action but failed in execution, such as a handling error, slip,
    lapse, checklist omission, control error, or loss of control during an
    otherwise normal task.
    Key test: they knew what to do, but did not do it correctly.
  - AE200 = Judgment / Decision-Making Error. Use AE200 when the person's plan,
    choice, or situational judgment was unsafe, such as choosing unsuitable
    conditions, continuing after a clear warning, selecting an unsafe route,
    speed, altitude, landing area, or maneuver.
    Key test: the choice of what to do was wrong before execution failed.
  - Both = AE100 and AE200 are both explicitly supported by distinct evidence.
  - Neither = neither AE100 nor AE200 is explicitly supported.

  Decision rules:
  1. Use the Rewritten_Narrative to identify unsafe acts directly described in
     the accident sequence.
  2. Use Unsafe_Act_Relevant_Facts to focus on the parts of the narrative that
     describe possible unsafe acts.
  3. Use Explicit_Decision_Evidence as the primary support for AE200.
     If this field is empty, do not select AE200 unless the Rewritten_Narrative
     itself explicitly states a wrong decision or unsafe plan.
  4. Use Explicit_Execution_Evidence as the primary support for AE100.
     If this field is empty, do not select AE100 unless the Rewritten_Narrative
     itself explicitly states an execution or skill-based failure.
  5. Use the preconditions and Evidence fields as supporting context, not as a
     substitute for an explicitly described unsafe act.
  6. Do not infer an unsafe act only because a precondition was present.
  7. Do not infer AE100 only because damage, impact, overrun, or loss occurred.
  8. Do not infer AE200 only because a safer alternative can be imagined.
  9. Select Both only when the rewritten narrative supports a wrong decision or
     plan and a separate execution failure.
  10. A reactive micro-decision inside an execution failure is not AE200 by
      itself. Do not assign AE200 merely because the pilot continued a landing,
      attempted a go-around, adjusted speed for wind, reduced power, became
      distracted, silenced/responded to a warning, or reacted after the aircraft
      was already in a deteriorating control situation.
  11. Before selecting Both, identify two separate acts: one AE200 wrong
      decision or plan and one AE100 execution failure. If you cannot clearly
      name two separate acts, do not select Both.
  12. For Both, do not count "hit terrain", "impacted water", "overran",
      "nosed over", "landed hard", or "lost control after the unsafe choice"
      as a separate AE100 unless the narrative describes a distinct slip,
      lapse, control input, checklist failure, or handling error.
  13. If an overrun, stall, failure to become airborne, nose-over, terrain
      impact, or loss of control is only the predictable physical consequence
      of a wrong decision, classify AE200 only unless a distinct execution
      failure is explicitly described.

  Common boundary patterns learned from examples:
  - Lost directional control during landing rollout, with no separate wrong
    plan, is AE100 only.
  - Bounced landing followed by a go-around attempt and loss of control is
    AE100 only; the go-around is a reaction within the failed landing sequence.
  - Forgetting, failing to reset, failing to secure, or missing a checklist or
    preflight item is AE100 only unless there is a separate deliberate risky
    decision.
  - Approach speed chosen for gusts/wind, power reduction for traffic/obstacles,
    or continuing during a developing landing problem is AE100 only unless a
    separate unsafe plan is explicitly described.
  - Wrong airport, wrong landing site, unsuitable surface, low flight, or
    continuing VFR into deteriorating visibility is AE200 only unless a separate
    handling error is clearly described.
  - Overrun, water/terrain impact, failure to become airborne, or striking an
    object after a wrong site/route/weather decision is usually AE200 only, not
    Both, when it is just the consequence of the wrong decision.
  - Bird strike, animal strike, unavoidable external obstacle, turbulence/gust
    encounter, or mechanical failure is Neither unless the narrative
    explicitly describes a human execution error or decision error.

  Examples to apply by analogy:
  - AE100 only: "During landing rollout, the pilot lost directional control and
    the airplane veered off the runway." Execution/control failure; no separate
    wrong plan.
  - AE200 only: "The pilot touched down fast on a short turf runway and overran
    the runway." Unsafe landing speed/surface judgment; no separate execution
    slip.
  - Both: "The pilot chose to land on a road. During the landing, he used too
    much brake, lost directional control, and the airplane went off the road."
    Wrong landing-location decision plus distinct braking/control failure.
  - Neither: "During initial climb, a bird struck the leading edge of the
    wing and substantially damaged the airplane." External event; no human
    error described.

  Decision order:
  1. Decide whether AE100 is independently supported.
  2. Decide whether AE200 is independently supported.
  3. Derive Final_Class from those two decisions:
     - AE100 Yes and AE200 No -> "AE100 only"
     - AE100 No and AE200 Yes -> "AE200 only"
     - AE100 Yes and AE200 Yes -> "Both"
     - AE100 No and AE200 No -> "Neither"

  Predict exactly one of: "AE100 only", "AE200 only", "Both", "Neither".

  Return only valid JSON in this exact format:
  {
    "Final_Class": "AE100 only/AE200 only/Both/None",
    "Codes_Selected": [],
    "Final_Justification": "",
    "Confidence": "Low/Medium/High"
  }
