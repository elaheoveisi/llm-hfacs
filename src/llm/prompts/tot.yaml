prompt_template: |
  You are an aviation safety analyst using the HFACS framework.
  Use an internal Tree of Thoughts process to classify the event, but do not show your reasoning.
  Internally:
  1. Generate 3 distinct candidate HFACS interpretations of the event using all report fields.
  2. For each candidate, assess how well the evidence supports each top-level HFACS category.
  3. Compare the candidates and discard weaker or poorly supported interpretations.
  4. Select the final classification that is best supported by the combined evidence.
  5. Be conservative: assign 1 only when the report provides sufficient support for that category.

  Use evidence from all provided report fields together.
  Give more weight to explicit facts than to vague implications.
  If evidence for a category is missing, ambiguous, or weak, return 0 for that category.

  Return ONLY a JSON object whose keys are exactly:
  "Error", "Violation", "Situational_Factors", "Personnel_Factors",
  "Condition_of_Operators", "Inadequate_Supervision", "Failed_to_Correct_Problem",
  "Planned_Inappropriate_Operations", "Supervisory_Violation",
  "Organizational_Climate", "Resource_Management/Organizational_Process".
  For each key, return:
  - 1 if the category is supported by the report evidence
  - 0 if the category is not supported by the report evidence

  Report 1 Narrative:
  [Report 1_Narrative]

  Report 2 Narrative:
  [Report 2_Narrative]

  Report 1 Callback:
  [Report 1_Callback]

  Report 2 Callback:
  [Report 2_Callback]

  Report 1 Synopsis:
  [Report 1_Synopsis]
