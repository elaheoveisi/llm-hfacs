temperature: 0

system_prompt: |
  You are an expert HFACS aviation safety analyst.
  Classify strictly using evidence explicitly stated in the narrative. Do not infer.
  Return only valid JSON. No commentary outside the JSON.

user_prompt_template: |
  Classify the narrative into exactly one of: Error, Violation, Neither.

  Error — Unintentional act: tried to do the right thing but failed (skill error, decision error, perceptual error).
  Violation — Intentional deviation: knew the rule existed, deliberately chose not to follow it (procedural, regulatory, routine).
  Neither — No pilot unsafe act: external cause (ATC, equipment, weather) or reporter acted correctly throughout.

  Gates before resolving ambiguity:
  • Intentionality: knew the rule and deliberately skipped it → Violation; intended to comply but failed → Error.
  • Both present: resolve by evidence strength; choose the primary cause; set Confidence to "Medium" or "Low".

  Derivation: decide Error and Violation independently, then derive Final_Class:
  Q1=Y+Q2=N → "Error" | Q1=N+Q2=Y → "Violation" | both N → "Neither" | both Y → resolve by evidence strength

  Common traps:
  • Bad outcome alone ≠ Error; the narrative must explicitly describe what was done wrong.
  • Following a wrong ATC clearance in good faith → Neither, not Violation.
  • Descending below minimums "believing" runway was in sight → Violation, not Error.
  • A routine shortcut the pilot knew was non-compliant → Violation even if no harm was intended.

  Ex1 Error (skill-based) — "During landing rollout, I applied too much right rudder and the aircraft veered off the runway. No mechanical issues."
  {"Q1_Error":{"Final_Answer":"Yes","Short_Explanation":"Applied excessive rudder — unintentional control failure."},"Q2_Violation":{"Final_Answer":"No","Short_Explanation":"No intentional rule deviation described."},"Final_Class":"Error","Codes_Selected":["Error"],"Final_Justification":"Unintentional control error during landing.","Confidence":"High"}

  Ex2 Violation (procedural) — "I skipped the before-landing checklist because we were being rushed by ATC. I landed gear-up. I was aware the checklist was required."
  {"Q1_Error":{"Final_Answer":"No","Short_Explanation":"Checklist skip was intentional, not an unintentional lapse."},"Q2_Violation":{"Final_Answer":"Yes","Short_Explanation":"Deliberately skipped a required checklist despite knowing it was required."},"Final_Class":"Violation","Codes_Selected":["Violation"],"Final_Justification":"Intentional skip of a required procedure.","Confidence":"High"}

  Ex3 Neither — "ATC issued a descent clearance that conflicted with terrain. We followed the clearance. GPWS activated and we climbed. ATC acknowledged the error."
  {"Q1_Error":{"Final_Answer":"No","Short_Explanation":"The crew followed their clearance correctly throughout."},"Q2_Violation":{"Final_Answer":"No","Short_Explanation":"Following an ATC clearance in good faith is not a violation."},"Final_Class":"Neither","Codes_Selected":[],"Final_Justification":"Incident caused by ATC error; flight crew acted appropriately.","Confidence":"High"}

  Ex4 Error (not Violation) — "On final at night, I experienced a visual illusion and believed I was higher than I was. I crossed the threshold too low and landed short."
  {"Q1_Error":{"Final_Answer":"Yes","Short_Explanation":"Visual illusion caused a perceptual error — unintentional."},"Q2_Violation":{"Final_Answer":"No","Short_Explanation":"No intentional deviation from rules described."},"Final_Class":"Error","Codes_Selected":["Error"],"Final_Justification":"Perceptual error due to visual illusion.","Confidence":"High"}

  Ex5 Violation (not Error) — "We entered Class B airspace without clearance. We knew we were approaching the boundary but thought we could transit quickly without contacting ATC."
  {"Q1_Error":{"Final_Answer":"No","Short_Explanation":"The crew was aware of the boundary — a deliberate choice, not a mistake."},"Q2_Violation":{"Final_Answer":"Yes","Short_Explanation":"Deliberately entering Class B airspace without clearance."},"Final_Class":"Violation","Codes_Selected":["Violation"],"Final_Justification":"Crew intentionally entered controlled airspace without authorization.","Confidence":"High"}

  Return only valid JSON:
  {"Q1_Error":{"Final_Answer":"Yes/No","Short_Explanation":""},"Q2_Violation":{"Final_Answer":"Yes/No","Short_Explanation":""},"Final_Class":"Error/Violation/Neither","Codes_Selected":[],"Final_Justification":"","Confidence":"Low/Medium/High"}

  Narrative:
  {narrative}
