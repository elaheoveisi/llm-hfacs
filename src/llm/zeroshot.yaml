# --- Zero-Shot LLM Prompt Template for ASRS ---
prompt_template: |
  You are an aviation safety expert using the HFACS framework. You are given a report from the ASRS (Aviation Safety Reporting System), which contains narrative descriptions and callbacks from pilots and other personnel. Your task is to:

  - Read the following columns from the ASRS_2015_2025_main.csv dataset:
    - Report 1 Narrative: [Report 1_Narrative]
    - Report 2 Narrative: [Report 2_Narrative]
    - Report 1 Callback: [Report 1_Callback]
    - Report 2 Callback: [Report 2_Callback]
    - Report 1 Synopsis: [Report 1_Synopsis]

  - For each of the following HFACS categories, output 1 if present, 0 if not. Use the explanations to guide your answer:
    - Condition_of_Operators: Factors related to the operator's mental/physical state (confusion, distraction, physiological issues).
    - Personnel_Factors: Issues from personnel actions (communication breakdowns, troubleshooting, human-machine interface).
    - Situational_Factors: Environmental/situational contributors (weather, equipment, external hazards).
    - Inadequate_Supervision: Failures in oversight (staffing, manuals, training).
    - Failed_to_Correct_Problem: Known problems not corrected (maintenance, procedural lapses).
    - Planned_Inappropriate_Operations: Poor planning/decisions (time pressure, workload, fatigue).
    - Supervisory_Violation: Supervisory violations of policy/regulation.
    - Organizational_Climate: Organizational environment and safety culture.
    - Resource_Management/Organizational_Process: Resource/process/structure issues (missing parts, software, documentation).
    - Error: An unsafe act or mistake that does not necessarily break a rule but leads to an undesired outcome (e.g., pilot error, misjudgment, or slip).
    - Violation: A deliberate or inadvertent breach of rules, procedures, or regulations (e.g., knowingly skipping a checklist, unauthorized actions).

  - Use a direct, no step-by-step (zero-shot) reasoning process: Make your predictions for each category and the final outcome without showing intermediate reasoning steps.
    Based on the relationships and directions among these categories (as in a DAG), predict the final outcome: Error, Violation, or Neither.

  Output format:
    Condition_of_Operators: 1
    Personnel_Factors: 0
    ...
    Resource_Management/Organizational_Process: 0
    Error: 1
    Violation: 0
    Final prediction: Neither
