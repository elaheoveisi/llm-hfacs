llm:
  api_key:   # set OPENAI_API_KEY env var instead
  input: balanced_processed_output_undersampled.csv
  prompt: classify_direct # yaml file name (without .yaml) in src/llm/prompts/ASRS/
  default_prompt: classify_direct
  model: gpt-4o-2024-11-20
  mode: sync # sync, batch_submit, batch_retrieve, evaluate
  limit: null # null for all rows
  compact: false
  evaluate: true # print accuracy + confusion matrix after classification
  retry_wait: 5 # seconds added to provider-suggested waits
  max_retries: 12
  workers: 4 # concurrent API requests (lower = fewer TPM rate-limit collisions)
  narrative_column: 'Report 1_Narrative'
  metadata_columns: []
  classes:
    - 'Error'
    - 'Violation'
    - 'Neither'
    - 'Both'
  json_models:
    - gpt-4o
    - gpt-4o-mini
    - gpt-4o-2024-11-20
  no_temperature_models:
    - gpt-5
  output_columns:
    - Final_Answer
    - Final_Class
    - Final_HFACS_Code
    - Codes_Selected
    - Final_Justification
    - Confidence
  ground_truth_columns: [category]

paths:
  ghfacs_data_dir: 'data/intermediate'
  llm_output_dir: 'data/intermediate'
  prompts_dir: 'src/llm/prompts/ASRS'
  processed_data: 'data/processed/'
  undersampled_csv: 'data/GHFACS/GAHFACS_Version3.xlsx'
  raw_data_dir: 'data/raw'
  processed_csv: 'data/processed/sampled_75_per_class.csv' #'data/intermediate/processed_output.csv'
  new_features_csv: 'data/intermediate/sampled_75_per_class_new_features.csv'
  processed_excel: 'data/intermediate/processed_output.xlsx'
  svm_output_dir: 'data/processed/svm'
  svm_classify_output_dir: 'data/processed/svm_classify'
  rf_output_dir: 'data/processed/rf'
  rf_classify_source: 'data/intermediate/processed_output.csv'
  rf_classify_input: 'data/intermediate/balanced_processed_output.csv'
  balanced_processed_output: 'data/intermediate/balanced_processed_output.csv'
  rf_new_features_output_dir: 'data/processed/rf_new_features'
  ghfacs_svm_output_dir: 'data/processed/ghfacs_svm'
  dag_output_dir: 'data/processed'
  eda_output_dir: 'data/intermediate'

