ghfacs:
  precondition_cols: [PE100, PE200, PP100, PT100, PC100, PC200, PC300]

ghfacs_dag:
  nodes: [PE100, PE200, PP100, PT100, PC100, PC200, PC300, AE100, AE200]
  sink_nodes: [AE100, AE200]
  score_func: 'local_score_BDeu'
  max_indegree: null

svm:
  tie_break: 'error'

models:
  random_state: 42
  test_size: 0.2

  svm:
    C: 2.3
    kernel: linear
    gamma: scale
    test_size: 0.15

  ghfacs_svm:
    C: 1
    kernel: rbf
    gamma: scale

  ghfacs_svm_nonbalance:
    C: 2.3
    kernel: linear
    gamma: scale

  ghfacs_rf:
    n_estimators: [100, 200, 500]
    max_depth: [null, 5, 10, 20]
    min_samples_split: [2, 5, 10]
    max_features: [sqrt, log2]
    cv_splits: 5

  ghfacs_bayes:
    n_samples: 1000
    tune: 500
    cores: 1

  rf:
    test_size: 0.2
    n_iter: 200
    n_estimators: [100, 200, 300, 500, 800, 1000]
    max_depth: [null, 5, 10, 15, 20, 30, 50]
    min_samples_split: [2, 5, 10, 15, 20]
    min_samples_leaf: [1, 2, 4, 8]
    max_features: [sqrt, log2, null]
    cv_splits: 5

  svm_classify:
    test_size: 0.15
    C: [0.1, 1, 10, 100]
    gamma: [scale, auto]
    cv_splits: 5
